<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIAL Games</title>
<meta name="description" content="RIAL Games: simulation, action and VR games on Steam.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--fg:#f2f5ff;--accent:#4df3ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05060a;color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;
  background:radial-gradient(circle at 30% 30%,#12304a,#05060a 70%)} /* fallback if WebGL is unavailable */
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:16px}
.orb{
  --d:min(86vw,86vh,480px);
  width:var(--d);height:var(--d);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(var(--d)*.14);gap:calc(var(--d)*.03);
  background:rgba(5,6,10,.38);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 0 0 1px rgba(77,243,255,.12),0 0 80px rgba(77,243,255,.18),inset 0 0 60px rgba(255,255,255,.04);
  animation:breathe 7s ease-in-out infinite;
}
@keyframes breathe{50%{transform:scale(1.025)}}
.kicker{font-size:calc(var(--d)*.024);letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
h1{font-weight:700;font-size:calc(var(--d)*.115);white-space:nowrap;letter-spacing:-.03em;line-height:1}
p{font-weight:300;font-size:calc(var(--d)*.037);line-height:1.5;color:rgba(242,245,255,.85);max-width:32ch}
.btn{
  margin-top:6px;display:inline-block;text-decoration:none;color:var(--fg);
  font-size:calc(var(--d)*.027);letter-spacing:.2em;text-transform:uppercase;
  padding:calc(var(--d)*.03) calc(var(--d)*.055);border:1px solid var(--accent);border-radius:99px;
  position:relative;overflow:hidden;transition:color .3s,box-shadow .3s;
}
.btn::before{content:"";position:absolute;inset:0;background:var(--accent);transform:translateY(101%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:-1}
.btn:hover,.btn:focus-visible{color:#05060a;box-shadow:0 0 28px rgba(77,243,255,.5);outline:none}
.btn:hover::before,.btn:focus-visible::before{transform:none}
@media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<main class="stage">
  <section class="orb">
    <div class="kicker">Independent studio</div>
    <h1>RIAL Games</h1>
    <p>Simulation, action and virtual reality games, built by Ricardo Alonso Pina. All on Steam.</p>
    <a class="btn" href="https://store.steampowered.com/search/?term=Ricardo+Alonso+Pina" target="_blank" rel="noopener">View games</a>
  </section>
</main>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 p;
void main(){gl_Position=vec4(p,0.,1.);}
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform vec2  uMouse;

float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  vec2 u=f*f*(3.-2.*f);
  return mix(a,b,u.x)+(c-a)*u.y*(1.-u.x)+(d-b)*u.x*u.y;
}
float fbm(vec2 p){
  float v=0.,a=.5;
  mat2 r=mat2(.8,-.6,.6,.8);
  for(int i=0;i<5;i++){v+=a*noise(p);p=r*p*2.02+7.;a*=.5;}
  return v;
}
vec3 pal(float t){
  return .5+.5*cos(6.28318*(vec3(1.,1.,1.)*t+vec3(.55,.2,.0)));
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/min(uRes.x,uRes.y);
  vec2 m=(uMouse-.5)*vec2(uRes.x/uRes.y,1.);
  float t=uTime*.12;

  vec2 q=vec2(fbm(uv*1.6+t),fbm(uv*1.6+vec2(5.2,1.3)-t));
  vec2 r=vec2(fbm(uv*2.0+3.*q+vec2(1.7,9.2)+t*1.3),fbm(uv*2.0+3.*q+vec2(8.3,2.8)-t*1.1));

  /* cursor bends the flow field */
  vec2 d=uv-m;
  float k=exp(-dot(d,d)*5.);
  r+=d*k*1.2;

  float f=fbm(uv*1.4+4.*r);
  vec3 col=pal(f*.9+length(q)*.35+t*.4);
  col*=.25+1.1*f*f+.5*f;

  /* cool, dark grade so the card text stays readable */
  col=mix(col,vec3(dot(col,vec3(.299,.587,.114))),.18);
  col*=vec3(.55,.8,1.05);
  float vig=smoothstep(1.35,.2,length(uv));
  col*=.35+.75*vig;
  col+=k*vec3(.05,.15,.2);
  gl_FragColor=vec4(col,1.);
}
</script>

<script>
(function(){
  var c=document.getElementById('gl');
  var gl=c.getContext('webgl',{antialias:false,alpha:false,powerPreference:'low-power'});
  if(!gl)return;                               /* CSS fallback gradient stays visible */

  function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn(gl.getShaderInfoLog(s));return null}return s}
  var v=sh(gl.VERTEX_SHADER,document.getElementById('vs').textContent);
  var f=sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent);
  if(!v||!f)return;
  var pr=gl.createProgram();gl.attachShader(pr,v);gl.attachShader(pr,f);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return;
  gl.useProgram(pr);

  var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

  var uRes=gl.getUniformLocation(pr,'uRes'),uTime=gl.getUniformLocation(pr,'uTime'),uMouse=gl.getUniformLocation(pr,'uMouse');
  var scale=Math.min(window.devicePixelRatio||1,1.5)*0.6;   /* render at reduced resolution: smooth shader, cheap on GPUs */
  var mx=.5,my=.5,tx=.5,ty=.5;

  function resize(){
    c.width=Math.floor(innerWidth*scale);c.height=Math.floor(innerHeight*scale);
    gl.viewport(0,0,c.width,c.height);gl.uniform2f(uRes,c.width,c.height);
  }
  addEventListener('resize',resize);resize();
  addEventListener('pointermove',function(e){tx=e.clientX/innerWidth;ty=1-e.clientY/innerHeight});

  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var t0=performance.now();
  function frame(now){
    mx+=(tx-mx)*.06;my+=(ty-my)*.06;
    gl.uniform1f(uTime,((now-t0)/1000)*(reduce?.25:1));
    gl.uniform2f(uMouse,mx,my);
    gl.drawArrays(gl.TRIANGLES,0,3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
